  <rect x="31" y="55" width="38" height="11" rx="3.5" fill="#e5782c"/>
  <rect x="26" y="50" width="10" height="19" rx="5" fill="#e5782c"/>
  <rect x="64" y="50" width="10" height="19" rx="5" fill="#e5782c"/>
