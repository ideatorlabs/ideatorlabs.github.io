<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B6FE0"/><stop offset="1" stop-color="#22B8CF"/></linearGradient>
<filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3B6FE0" flood-opacity=".10"/></filter>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#D3E0F3"/></pattern>
</defs>
<rect width="1120" height="240" rx="18" fill="url(#wash)"/><rect width="1120" height="240" rx="18" fill="url(#dots)"/>
