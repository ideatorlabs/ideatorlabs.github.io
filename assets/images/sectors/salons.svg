<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 240" role="img" aria-labelledby="t">
<title id="t">Packages, visits and commissions become a chain the owner can check</title>
<style>
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 700; letter-spacing: .12em; fill: #4A5B7E; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1E2A44; font-weight: 600; }
  .card { fill: #FFFFFF; stroke: #D9E5F5; stroke-width: 1; filter: url(#lift); }
  .skel { fill: #E6EEF9; }
  .wire { fill: none; stroke: #9DB8E6; stroke-width: 1.6; stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -40; } }
  .blink { animation: blink 2.4s ease-in-out infinite; } .b2 { animation-delay: .8s; } .b3 { animation-delay: 1.6s; }
  @keyframes blink { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
  .ping { transform-box: fill-box; transform-origin: center; animation: ping 3s ease-out infinite; }
  @keyframes ping { 0% { transform: scale(1); opacity: .35; } 100% { transform: scale(1.5); opacity: 0; } }
  .float { animation: float 6s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .tick { stroke-dasharray: 16; animation: tick 6s ease-in-out infinite; } .t2 { animation-delay: .6s; }
  @keyframes tick { 0%, 15% { stroke-dashoffset: 16; } 30%, 90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 16; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
